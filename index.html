    <div class="container">
        <header>
                    <div class="logo">

                    <!-- logo image -->
                    <img src="./images/crubchieslogo.png" alt="crunchies logo">

                    <div class="location-icon">
                        <span class="material-symbols-outlined">
                                location_on

                </div>

                <nav>
                    <a href="#" class="nav-home">Home</a>

                        shopping_cart

                            menu
                        </span>
                </div>
        </header>

        <main>
                <div class="main-menu-text">
                    <div class="welcome-text">
                        <p>Welcome to CRUNCHIES!</p>
                        <!-- <p class="sub-text">...taste the difference</p> -->

                    </div>

                        <!-- main call to action button -->
                    <div class="main-cta">
                        <p class="cta-text">How would you like to recieve your <br>order?</p>

                        <div class="main-cta-btn">
                            <button>
                                <span class="material-symbols-outlined">
                                    local_shipping
                                </span> <p>DELIVERY</p>
                            </button>

                            <!-- pickup button-->
                            <button>
                                <span class="material-symbols-outlined">
                                    shopping_bag
                                </span> <p>PICKUP</p>
                            </button>
                        </div>
                    </div>
                </div>
            

                <div class="main-menu-image">
                    <img src="./images/mainimageedited.png" alt="">
